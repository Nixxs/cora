name: cora

services:
  database:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORA_DB_NAME:?Set CORA_DB_NAME in .env.database}
      POSTGRES_USER: ${CORA_DB_USER:?Set CORA_DB_USER in .env.database}
      POSTGRES_PASSWORD: ${CORA_DB_PASSWORD:?Set CORA_DB_PASSWORD in .env.database}
    ports:
      - "127.0.0.1:${CORA_DB_PORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  database-data: