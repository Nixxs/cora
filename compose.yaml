name: cora

services:
  database:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORA_DB_NAME:?Set CORA_DB_NAME in .env.database}
      POSTGRES_USER: ${CORA_DB_USER:?Set CORA_DB_USER in .env.database}
      POSTGRES_PASSWORD: ${CORA_DB_PASSWORD:?Set CORA_DB_PASSWORD in .env.database}
    ports:
      - "127.0.0.1:${CORA_DB_PORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Cora's own Signal account (optional). Started and stopped from Settings > Services;
  # `docker compose up` without the profile leaves it alone. It holds her Signal keys.
  signal:
    image: ghcr.io/asamk/signal-cli:0.14.8
    profiles: ["signal"]
    restart: unless-stopped
    # Received messages go to Cora over the local API only, never into the container's log.
    # It fetches messages only while Cora listens, so ones sent while she's closed wait on
    # Signal's servers until she next connects rather than being fetched with nobody to read them.
    command: ["daemon", "--http", "0.0.0.0:8080", "--no-receive-stdout", "--receive-mode", "on-connection"]
    ports:
      - "127.0.0.1:${CORA_SIGNAL_PORT:-8090}:8080"
    volumes:
      - signal-data:/var/lib/signal-cli

  # Cora's browser (optional), the Browser service in Settings > Services. While it's switched on,
  # Cora runs one with `docker compose run` and talks to it over stdin/stdout; it's removed, with
  # everything it wrote, when switched off or when she quits. Nothing to `up`.
  browser:
    # Headless Chromium as a non-root user (with tini); the container is its sandbox.
    image: mcr.microsoft.com/playwright/mcp:v0.0.83
    profiles: ["browser"]
    command: ["--isolated", "--image-responses", "omit"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    # Its own network: it reaches the web, but not the database or Signal by name.
    networks: [browser]

volumes:
  database-data:
  signal-data:

networks:
  browser: